<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOVIXA HD - Premium Streaming</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        :root {
            --bg: #080a12;
            --surface: #121624;
            --gold: #FFD700;
            --violet: #8A2BE2;
            --text: #ffffff;
            --text-muted: #8892b0;
            --danger: #ff4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* --- VIEW MANAGEMENT --- */
        .view { display: none; min-height: 100vh; }
        .view.active { display: block; }

        /* --- NAVBAR --- */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 4%; background: rgba(8,10,18,0.95); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { font-size: 1.8rem; font-weight: 900; background: linear-gradient(45deg, var(--gold), var(--violet)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .search-icon { color: white; cursor: pointer; font-size: 1.2rem; }

        /* --- LANDING PAGE --- */
        .hero { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 6rem 2rem; }
        .hero h1 { font-size: 4.5rem; font-weight: 900; background: linear-gradient(135deg, #fff 0%, var(--gold) 90%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 1rem; }
        .hero p { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 2rem; max-width: 600px; }
        .btn-gold { background: var(--gold); color: #000; padding: 15px 40px; border-radius: 50px; font-size: 1.2rem; font-weight: 800; border: none; cursor: pointer; transition: 0.3s; }
        .btn-gold:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,215,0,0.4); }

        /* --- AUTH PAGE --- */
        .auth-container { display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 2rem; }
        .auth-box { background: var(--surface); padding: 2.5rem; border-radius: 12px; border: 1px solid rgba(255,215,0,0.2); width: 100%; max-width: 400px; }
        .auth-box h2 { text-align: center; margin-bottom: 1.5rem; font-size: 1.8rem; }
        .auth-box input { width: 100%; padding: 15px; margin-bottom: 10px; background: #080a12; border: 1px solid #333; border-radius: 8px; color: white; font-size: 1rem; }
        .auth-box input:focus { outline: none; border-color: var(--gold); }
        .auth-btn { width: 100%; background: var(--gold); color: #000; padding: 15px; border: none; border-radius: 8px; font-weight: 800; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        .auth-error { color: var(--danger); text-align: center; font-size: 0.9rem; margin-bottom: 10px; display: none; }
        .auth-toggle { text-align: center; margin-top: 15px; font-size: 0.9rem; color: var(--text-muted); cursor: pointer; }
        .auth-toggle span { color: var(--gold); font-weight: bold; }

        /* --- DASHBOARD --- */
        .dashboard-nav { display: flex; gap: 1.5rem; padding: 1rem 4%; background: #0a0c14; overflow-x: auto; border-bottom: 1px solid rgba(255,255,255,0.05); scrollbar-width: none; }
        .dashboard-nav::-webkit-scrollbar { display: none; }
        .dashboard-nav a { color: var(--text-muted); text-decoration: none; white-space: nowrap; cursor: pointer; font-weight: 600; padding-bottom: 5px; border-bottom: 2px solid transparent; transition: 0.2s; }
        .dashboard-nav a:hover, .dashboard-nav a.active { color: var(--gold); border-bottom-color: var(--gold); }

        .movie-section { padding: 2rem 4%; }
        .movie-section h2 { margin-bottom: 1rem; font-size: 1.5rem; }
        .movie-grid { display: flex; gap: 1rem; overflow-x: auto; padding-bottom: 1rem; scrollbar-width: none; }
        .movie-grid::-webkit-scrollbar { display: none; }
        .movie-card { flex: 0 0 auto; width: 180px; background: var(--surface); border-radius: 10px; overflow: hidden; cursor: pointer; border: 1px solid transparent; transition: 0.3s; position: relative; }
        .movie-card:hover { border-color: var(--gold); transform: scale(1.02); }
        .movie-poster { width: 100%; height: 260px; object-fit: cover; display: block; }
        .movie-info { padding: 10px; }
        .movie-title { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-meta { font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: space-between; margin-top: 5px; }

        /* --- SEARCH OVERLAY --- */
        .search-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8,10,18,0.98); z-index: 200; padding: 4rem 1rem 1rem; overflow-y: auto; }
        .search-overlay input { width: 100%; max-width: 600px; display: block; margin: 0 auto 2rem; padding: 15px; border-radius: 50px; border: 2px solid var(--gold); background: var(--surface); color: white; font-size: 1.2rem; }
        .search-results { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; max-width: 1200px; margin: 0 auto; }
        .search-close { position: fixed; top: 20px; right: 20px; font-size: 2rem; color: white; cursor: pointer; z-index: 201; }

        /* --- MODAL --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { width: 90%; max-width: 1000px; background: #000; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid var(--gold); }
        .close-modal { position: absolute; top: 15px; right: 15px; color: white; font-size: 2rem; cursor: pointer; z-index: 10; background: rgba(0,0,0,0.5); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        iframe { width: 100%; height: 550px; border: none; }

        /* --- MOVIE DETAILS MODAL --- */
        .details-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1100; justify-content: center; align-items: center; }
        .details-modal.active { display: flex; }
        .details-content { width: 90%; max-width: 800px; background: var(--surface); border-radius: 12px; overflow: hidden; position: relative; border: 1px solid var(--gold); max-height: 90vh; overflow-y: auto; }
        .details-backdrop { width: 100%; height: 300px; background-size: cover; background-position: center; position: relative; }
        .details-backdrop::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, transparent, var(--surface)); }
        .details-body { padding: 0 2rem 2rem; margin-top: -60px; position: relative; z-index: 2; }
        .details-body h2 { font-size: 2rem; margin-bottom: 5px; }
        .details-meta { display: flex; gap: 15px; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem; }
        .details-overview { color: #ddd; line-height: 1.6; margin-bottom: 1.5rem; }
        .details-btns { display: flex; gap: 10px; flex-wrap: wrap; }

        /* --- LOADER --- */
        .loader { text-align: center; padding: 2rem; color: var(--gold); }
        .spinner { display: inline-block; width: 40px; height: 40px; border: 4px solid #333; border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .hero h1 { font-size: 3rem; }
            .movie-card { width: 140px; }
            .movie-poster { height: 200px; }
            iframe { height: 250px; }
            .details-backdrop { height: 200px; }
            .details-body h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- 1. LANDING PAGE -->
    <div id="view-landing" class="view active">
        <div class="navbar">
            <div class="logo">MOVIXA HD</div>
            <button class="btn-gold" onclick="showAuthView()">Join Free</button>
        </div>
        <div class="hero">
            <h1>MOVIXA HD</h1>
            <p>Stream unlimited movies and TV shows in stunning HD. No ads, no interruptions.</p>
            <button class="btn-gold" onclick="showAuthView()">▶ Start Streaming</button>
        </div>
    </div>

    <!-- 2. AUTH PAGE -->
    <div id="view-auth" class="view">
        <div class="navbar">
            <div class="logo" onclick="showLandingView()">MOVIXA HD</div>
        </div>
        <div class="auth-container">
            <div class="auth-box">
                <h2 id="auth-heading">Create Account</h2>
                <div id="auth-error" class="auth-error"></div>
                <input type="text" id="auth-username" placeholder="Username (optional)">
                <input type="email" id="auth-email" placeholder="Email (e.g. name@gmail.com)">
                <input type="password" id="auth-password" placeholder="Password (min 6 chars)">
                <button class="auth-btn" id="auth-submit-btn" onclick="handleAuth()">Sign Up</button>
                <div class="auth-toggle" id="auth-toggle-btn" onclick="toggleAuth()">Already have an account? <span>Sign In</span></div>
            </div>
        </div>
    </div>

    <!-- 3. DASHBOARD -->
    <div id="view-dashboard" class="view">
        <div class="navbar">
            <div class="logo">MOVIXA HD</div>
            <div style="display:flex; gap:15px; align-items:center;">
                <i class="fas fa-search search-icon" onclick="openSearch()"></i>
                <span style="color:var(--gold); font-weight:bold;" id="user-display-name"></span>
                <button class="btn-gold" style="padding: 8px 15px; font-size: 0.9rem;" onclick="logout()">Logout</button>
            </div>
        </div>
        <div class="dashboard-nav" id="dashboard-nav">
            <!-- 10 Categories like Cinexus -->
            <a onclick="loadMovies('trending')" class="active" id="nav-trending">🔥 Trending</a>
            <a onclick="loadMovies('movie/popular')" id="nav-popular">🎬 Popular</a>
            <a onclick="loadMovies('movie/top_rated')" id="nav-top_rated">🏆 Top Rated</a>
            <a onclick="loadMovies('tv/popular')" id="nav-tv">📺 TV Shows</a>
            <a onclick="loadMovies('movie/now_playing')" id="nav-now_playing">🎥 In Theaters</a>
            <a onclick="loadMovies('movie/upcoming')" id="nav-upcoming">🚀 Upcoming</a>
            <a onclick="loadMovies('discover/movie?with_genres=28')" id="nav-action">💥 Action</a>
            <a onclick="loadMovies('discover/movie?with_genres=35')" id="nav-comedy">😂 Comedy</a>
            <a onclick="loadMovies('discover/movie?with_genres=27')" id="nav-horror">👻 Horror</a>
            <a onclick="loadMovies('discover/movie?with_genres=10749')" id="nav-romance">❤️ Romance</a>
        </div>
        <div class="movie-section" id="movie-container">
            <div class="loader"><div class="spinner"></div></div>
        </div>
    </div>

    <!-- SEARCH OVERLAY -->
    <div id="search-overlay" class="search-overlay">
        <span class="search-close" onclick="closeSearch()">&times;</span>
        <input type="text" id="search-input" placeholder="Search for a movie or TV show..." onkeyup="performSearch(event)">
        <div id="search-results" class="search-results"></div>
    </div>

    <!-- VIDEO PLAYER MODAL -->
    <div id="video-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeVideo()">&times;</span>
            <iframe id="video-player" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>
    </div>

    <!-- MOVIE DETAILS MODAL (Like Cinexus) -->
    <div id="details-modal" class="details-modal">
        <div class="details-content">
            <span class="close-modal" style="position: absolute;" onclick="closeDetails()">&times;</span>
            <div class="details-backdrop" id="details-backdrop"></div>
            <div class="details-body">
                <h2 id="details-title"></h2>
                <div class="details-meta">
                    <span id="details-year"></span>
                    <span id="details-rating"></span>
                </div>
                <p class="details-overview" id="details-overview"></p>
                <div class="details-btns">
                    <button class="btn-gold" id="details-watch-btn">▶ Watch Now</button>
                    <button class="btn-gold" style="background:#333; color:white;" id="details-trailer-btn">🎬 Trailer</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. FIREBASE CONFIGURATION
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyB-9QzBOU6vFST4EvxdhFEIz5QBA1D-XW0",
            authDomain: "monkius-full-stream.firebaseapp.com",
            projectId: "monkius-full-stream",
            storageBucket: "monkius-full-stream.firebasestorage.app",
            messagingSenderId: "276409313367",
            appId: "1:276409313367:web:1eb2fb48df4feb9c801b12"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // ==========================================
        // 2. TMDB CONFIGURATION
        // ==========================================
        const TMDB_KEY = "20ccd2ea8beed60c0af73311d4d17f51";
        const IMG_PATH = "https://image.tmdb.org/t/p/w500";

        let isSignUp = true;
        let currentCategory = 'trending';

        // ==========================================
        // 3. VIEW MANAGEMENT
        // ==========================================
        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function showLandingView() { switchView('view-landing'); }
        function showAuthView() { switchView('view-auth'); }

        function showDashboardView() {
            switchView('view-dashboard');
            const user = auth.currentUser;
            if(user) {
                document.getElementById('user-display-name').innerText = user.email.split('@')[0];
                loadMovies('trending');
            }
        }

        // ==========================================
        // 4. AUTHENTICATION LOGIC
        // ==========================================
        function toggleAuth() {
            isSignUp = !isSignUp;
            document.getElementById('auth-heading').innerText = isSignUp ? 'Create Account' : 'Sign In';
            document.getElementById('auth-submit-btn').innerText = isSignUp ? 'Sign Up' : 'Sign In';
            document.getElementById('auth-toggle-btn').innerHTML = isSignUp ? 'Already have an account? <span>Sign In</span>' : 'New to MOVIXA HD? <span>Sign Up</span>';
            document.getElementById('auth-error').style.display = 'none';
        }

        async function handleAuth() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            const errorBox = document.getElementById('auth-error');
            const btn = document.getElementById('auth-submit-btn');

            errorBox.style.display = 'none';

            if(!email || !password) {
                errorBox.innerText = "Please enter email and password.";
                errorBox.style.display = 'block';
                return;
            }

            try {
                btn.disabled = true;
                btn.innerText = "Processing...";

                if(isSignUp) {
                    await auth.createUserWithEmailAndPassword(email, password);
                } else {
                    await auth.signInWithEmailAndPassword(email, password);
                }
            } catch(e) {
                let msg = e.message;
                if(msg.includes('invalid-email')) msg = 'Please enter a valid email (e.g., user@gmail.com).';
                if(msg.includes('weak-password')) msg = 'Password must be at least 6 characters.';
                if(msg.includes('email-already-in-use')) msg = 'Email already in use. Try signing in.';
                if(msg.includes('invalid-credential')) msg = 'Incorrect email or password.';
                
                errorBox.innerText = msg;
                errorBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = isSignUp ? 'Sign Up' : 'Sign In';
            }
        }

        function logout() {
            auth.signOut();
        }

        auth.onAuthStateChanged(user => {
            if(user) showDashboardView();
            else showLandingView();
        });

        // ==========================================
        // 5. TMDB MOVIE FETCHING (10 Categories)
        // ==========================================
        async function loadMovies(category) {
            currentCategory = category;
            const container = document.getElementById('movie-container');
            container.innerHTML = '<div class="loader"><div class="spinner"></div></div>';

            // Update active nav
            document.querySelectorAll('.dashboard-nav a').forEach(a => a.classList.remove('active'));
            // Determine which nav to highlight
            if(category === 'trending') document.getElementById('nav-trending').classList.add('active');
            else if(category === 'movie/popular') document.getElementById('nav-popular').classList.add('active');
            else if(category === 'movie/top_rated') document.getElementById('nav-top_rated').classList.add('active');
            else if(category === 'tv/popular') document.getElementById('nav-tv').classList.add('active');
            else if(category === 'movie/now_playing') document.getElementById('nav-now_playing').classList.add('active');
            else if(category === 'movie/upcoming') document.getElementById('nav-upcoming').classList.add('active');
            else if(category.includes('28')) document.getElementById('nav-action').classList.add('active');
            else if(category.includes('35')) document.getElementById('nav-comedy').classList.add('active');
            else if(category.includes('27')) document.getElementById('nav-horror').classList.add('active');
            else if(category.includes('10749')) document.getElementById('nav-romance').classList.add('active');

            // Build URL
            let url = '';
            if(category === 'trending') {
                url = `https://api.themoviedb.org/3/trending/movie/week?api_key=${TMDB_KEY}&page=1`;
            } else if(category.includes('?')) {
                url = `https://api.themoviedb.org/3/${category}&api_key=${TMDB_KEY}&page=1`;
            } else {
                url = `https://api.themoviedb.org/3/${category}?api_key=${TMDB_KEY}&page=1`;
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                if(!data.results) throw new Error("No data");

                let html = `<div class="movie-grid">`;
                data.results.forEach(movie => {
                    const title = movie.title || movie.name;
                    const poster = movie.poster_path ? IMG_PATH + movie.poster_path : 'https://placehold.co/300x450/121624/FFF?text=No+Poster';
                    const year = (movie.release_date || movie.first_air_date || '').split('-')[0] || 'N/A';
                    const rating = movie.vote_average ? movie.vote_average.toFixed(1) : '0.0';
                    const type = category.includes('tv') ? 'tv' : 'movie';

                    // Store movie data in a temporary global object for details modal
                    const movieData = JSON.stringify({ id: movie.id, title: title, overview: movie.overview || '', poster: movie.poster_path, year: year, rating: rating, type: type }).replace(/'/g, "&#39;");

                    html += `
                        <div class="movie-card" onclick="openDetails('${movie.id}', '${type}', '${title.replace(/'/g, "\\'")}', '${movie.poster_path}', '${(movie.overview || '').replace(/'/g, "\\'")}', '${year}', '${rating}')">
                            <img src="${poster}" class="movie-poster" loading="lazy">
                            <div class="movie-info">
                                <div class="movie-title">${title}</div>
                                <div class="movie-meta"><span>${year}</span><span>⭐ ${rating}</span></div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
                container.innerHTML = html;
            } catch(e) {
                container.innerHTML = `<p style="color: var(--danger);">Failed to load movies. Check your internet or TMDB API Key.</p>`;
            }
        }

        // ==========================================
        // 6. MOVIE DETAILS MODAL
        // ==========================================
        function openDetails(id, type, title, poster, overview, year, rating) {
            document.getElementById('details-title').innerText = title;
            document.getElementById('details-year').innerText = year;
            document.getElementById('details-rating').innerText = `⭐ ${rating}`;
            document.getElementById('details-overview').innerText = overview || 'No description available.';
            document.getElementById('details-backdrop').style.backgroundImage = poster ? `url(https://image.tmdb.org/t/p/w500${poster})` : 'none';

            const watchBtn = document.getElementById('details-watch-btn');
            const trailerBtn = document.getElementById('details-trailer-btn');

            // Remove old listeners by cloning
            const newWatchBtn = watchBtn.cloneNode(true);
            const newTrailerBtn = trailerBtn.cloneNode(true);
            watchBtn.parentNode.replaceChild(newWatchBtn, watchBtn);
            trailerBtn.parentNode.replaceChild(newTrailerBtn, trailerBtn);

            newWatchBtn.onclick = () => { closeDetails(); playMovie(id, type); };
            newTrailerBtn.onclick = () => { closeDetails(); openTrailer(id, type); };

            document.getElementById('details-modal').classList.add('active');
        }

        function closeDetails() {
            document.getElementById('details-modal').classList.remove('active');
        }

        // ==========================================
        // 7. TRAILER PLAYER
        // ==========================================
        async function openTrailer(id, type) {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}/videos?api_key=${TMDB_KEY}`);
                const data = await res.json();
                const trailer = data.results.find(v => v.type === 'Trailer' && v.site === 'YouTube') || data.results.find(v => v.site === 'YouTube');
                
                if(trailer) {
                    const iframe = document.getElementById('video-player');
                    iframe.src = `https://www.youtube.com/embed/${trailer.key}?autoplay=1`;
                    document.getElementById('video-modal').classList.add('active');
                } else {
                    alert('No trailer available for this movie.');
                }
            } catch(e) {
                alert('Error loading trailer.');
            }
        }

        // ==========================================
        // 8. SEARCH FUNCTIONALITY
        // ==========================================
        function openSearch() {
            document.getElementById('search-overlay').style.display = 'block';
            document.getElementById('search-input').focus();
        }

        function closeSearch() {
            document.getElementById('search-overlay').style.display = 'none';
            document.getElementById('search-input').value = '';
            document.getElementById('search-results').innerHTML = '';
        }

        async function performSearch(event) {
            if(event.key !== 'Enter') return;
            const query = document.getElementById('search-input').value.trim();
            if(!query) return;

            const resultsDiv = document.getElementById('search-results');
            resultsDiv.innerHTML = '<div class="loader"><div class="spinner"></div></div>';

            try {
                const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}`);
                const data = await res.json();
                
                if(!data.results || data.results.length === 0) {
                    resultsDiv.innerHTML = '<p>No results found.</p>';
                    return;
                }

                resultsDiv.innerHTML = '';
                data.results.filter(m => m.media_type === 'movie' || m.media_type === 'tv').slice(0, 12).forEach(movie => {
                    const title = movie.title || movie.name;
                    const poster = movie.poster_path ? IMG_PATH + movie.poster_path : 'https://placehold.co/300x450/121624/FFF?text=No+Poster';
                    const type = movie.media_type;

                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.innerHTML = `
                        <img src="${poster}" class="movie-poster">
                        <div class="movie-info"><div class="movie-title">${title}</div></div>
                    `;
                    card.onclick = () => { 
                        closeSearch(); 
                        openDetails(movie.id, type, title, movie.poster_path, movie.overview, (movie.release_date || movie.first_air_date || '').split('-')[0] || 'N/A', movie.vote_average ? movie.vote_average.toFixed(1) : '0.0');
                    };
                    resultsDiv.appendChild(card);
                });
            } catch(e) {
                resultsDiv.innerHTML = '<p>Search failed. Check connection.</p>';
            }
        }

        // ==========================================
        // 9. VIDEO PLAYER (VidSrc)
        // ==========================================
        function playMovie(id, type) {
            const modal = document.getElementById('video-modal');
            const iframe = document.getElementById('video-player');
            iframe.src = `https://vidsrc.xyz/embed/${type}/${id}?autoplay=1`;
            modal.classList.add('active');
        }

        function closeVideo() {
            const modal = document.getElementById('video-modal');
            const iframe = document.getElementById('video-player');
            modal.classList.remove('active');
            iframe.src = '';
        }
    </script>
</body>
</html>
