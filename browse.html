<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browse Movies &amp; TV Shows – MOVIXA STREAM</title>
<meta name="description" content="Browse trending movies and TV shows on MOVIXA STREAM.">
<meta name="theme-color" content="#07070b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="nav" id="nav">
  <a class="logo" href="/">MOVIXA<span> STREAM</span></a>
  <nav class="tabs" id="tabs"></nav>
  <div class="sp"></div>
  <div class="search"><input id="q" type="search" placeholder="Search movies &amp; shows  ( / )" autocomplete="off" aria-label="Search"></div>
  <div class="usr" id="user"></div>
</header>

<main>
  <section class="hero" id="hero">
    <div class="in">
      <span class="kindtag" id="hKind">MOVIE</span>
      <h1 id="hTitle">MOVIXA STREAM</h1>
      <div class="meta" id="hMeta"></div>
      <p id="hOv">Loading the latest titles…</p>
      <div class="acts">
        <button class="btn p" id="hPlay">▶ Play Trailer</button>
        <button class="btn s" id="hInfo">ⓘ More Info</button>
      </div>
    </div>
    <div class="dots" id="dots"></div>
  </section>

  <nav class="chips" id="chips" aria-label="Genres" hidden></nav>
  <div id="home"></div>

  <section class="grid-view" id="grid" hidden>
    <div class="ghead">
      <h2 id="gridTitle"></h2>
      <div id="sortbar" hidden>
        <select id="sort" aria-label="Sort">
          <option value="pop">Most popular</option>
          <option value="top">Top rated</option>
          <option value="new">Newest</option>
        </select>
      </div>
    </div>
    <div class="items" id="items"></div>
    <button class="btn s more" id="more" hidden>Load more</button>
  </section>
</main>

<nav class="tabbar" id="tabbar" aria-label="Main"></nav>

<div class="modal" id="modal" hidden>
  <div class="sheet">
    <button class="x" id="close" aria-label="Close">✕</button>
    <div id="mbody"></div>
  </div>
</div>

<footer class="foot" id="siteFooter"></footer>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
